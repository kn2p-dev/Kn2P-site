# Pulls the MoriPay terms / privacy policy from microCMS, rebuilds the site and
# publishes it (commit to main → GitHub Pages).
# Runs only when started by hand: Actions → "Update legal pages" → Run workflow.
# Needs the repository secret MICROCMS_API_KEY (read-only GET key).
name: Update legal pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-legal
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download documents from microCMS
        env:
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: python3 _src/fetch_legal.py

      - name: Build site
        run: python3 _src/build.py

      - name: Commit and push if anything changed
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: microCMS 약관 갱신"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request a GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
